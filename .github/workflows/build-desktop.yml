name: Desktop Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows app (x64)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: |
          rustup show
          rustup target add x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust_backend/target
          key: cargo-${{ runner.os }}-x64-desktop-${{ hashFiles('rust_backend/rust-toolchain.toml') }}-${{ hashFiles('rust_backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-x64-desktop-

      - name: Build Rust desktop library
        run: ./scripts/build_rust_backend_windows.ps1 -Target x86_64-pc-windows-msvc

      - name: Fetch LGPL FFmpeg
        shell: bash
        run: bash scripts/fetch_desktop_ffmpeg.sh windows-x64

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~\AppData\Local\Pub\Cache
          key: pub-${{ runner.os }}-x64-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-x64-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      - name: Build Windows app
        run: |
          $commit = git rev-parse --short=8 HEAD
          flutter build windows --release --target lib/main.dart --dart-define="GIT_COMMIT=$commit"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and package Windows app
        run: |
          $bundle = 'build\windows\x64\runner\Release'
          ./scripts/check_windows_bundle.ps1 -BundleDir $bundle -Arch x64
          New-Item -ItemType Directory -Force build\desktop | Out-Null
          Compress-Archive -Path "$bundle\*" -DestinationPath build\desktop\Mornye-windows-x64.zip -Force

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Mornye-windows-x64
          if-no-files-found: error
          path: build/desktop/Mornye-windows-x64.zip

  build-linux:
    name: Linux bundle (x64)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config zip \
            libgtk-3-dev liblzma-dev libsecret-1-dev libstdc++-12-dev \
            libjson-glib-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libasound2-dev libclang-dev libmpv-dev

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Cache Cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust_backend/target
          key: cargo-${{ runner.os }}-x64-desktop-${{ hashFiles('rust_backend/rust-toolchain.toml') }}-${{ hashFiles('rust_backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-x64-desktop-

      - name: Build Rust desktop library
        run: bash scripts/build_rust_backend.sh desktop

      - name: Fetch LGPL FFmpeg
        run: bash scripts/fetch_desktop_ffmpeg.sh linux-x64

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-x64-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-x64-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      - name: Build Linux bundle
        run: |
          commit="$(git rev-parse --short=8 HEAD)"
          flutter build linux --release --target lib/main.dart --dart-define="GIT_COMMIT=$commit"

      - name: Verify and package Linux bundle
        run: |
          bundle="build/linux/x64/release/bundle"
          test -x "$bundle/mornye"
          test -s "$bundle/lib/libmornye_desktop.so"
          ffmpeg_dir="$bundle/lib/ffmpeg"
          for tool in ffmpeg ffprobe; do
            test -x "$ffmpeg_dir/$tool"
            "$ffmpeg_dir/$tool" -hide_banner -version > /dev/null
          done
          test -s "$ffmpeg_dir/LICENSE.txt"
          test -s "$ffmpeg_dir/SOURCE.txt"
          if "$ffmpeg_dir/ffmpeg" -hide_banner -buildconf | grep -E -- '--enable-(gpl|nonfree)'; then
            exit 1
          fi
          mkdir -p build/desktop
          (cd "$bundle" && zip -r -y "$GITHUB_WORKSPACE/build/desktop/Mornye-linux-x64.zip" .)

      - name: Upload Linux bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Mornye-linux-x64
          if-no-files-found: error
          path: build/desktop/Mornye-linux-x64.zip
